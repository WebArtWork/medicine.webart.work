<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Medicine | Learn the science of healthcare</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			try {
				const storedMode = localStorage.getItem('theme.mode');
				const preferredMode =
					storedMode === 'dark' || storedMode === 'light'
						? storedMode
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.setAttribute('data-mode', preferredMode);
			} catch {}
		</script>

		<meta
			name="description"
			content="Study anatomy, physiology, disease and medical reasoning through structured lessons and fictional clinical cases."
		/>

		<meta name="theme-color" content="#F5FAF9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#102322" media="(prefers-color-scheme: dark)" />
		<meta name="author" content="Medicine" />
		<meta name="robots" content="index, follow" />

		<meta itemprop="name" content="Medicine | Learn the science of healthcare" />
		<meta
			itemprop="description"
			content="Study anatomy, physiology, disease and medical reasoning through structured lessons and fictional clinical cases."
		/>
		<meta itemprop="image" content="https://medicine.webart.work/seo/dashboard.jpg" />
